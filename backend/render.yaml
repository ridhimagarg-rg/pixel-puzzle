services:
  - type: web
    name: pixel-puzzle-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-app.vercel.app
